# Example: Nginx configuration for sticky session routing
# based on A2A contextId header.
#
# This routes all messages with the same contextId to the same
# backend instance, enabling stateful multi-turn conversations
# across load-balanced agent replicas.
#
# This is a discussion/demo config for Exercise 5.

upstream concierge_agents {
    # Multiple replicas of the Concierge agent
    server localhost:8090;
    server localhost:8091;
    server localhost:8092;
}

map $http_x_a2a_context_id $context_backend {
    default concierge_agents;
}

server {
    listen 80;

    location / {
        proxy_pass http://concierge_agents;

        # Sticky sessions based on contextId
        # In production, use a proper session affinity module
        # or route based on consistent hashing of the contextId
        proxy_set_header X-A2A-Context-Id $http_x_a2a_context_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Long timeout for LLM-backed agents
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
