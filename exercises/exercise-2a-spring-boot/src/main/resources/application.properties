# Spring Boot HTTP
server.port=8081

# Ollama LLM Configuration
langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.model-name=mistral
langchain4j.ollama.chat-model.temperature=0.7
langchain4j.ollama.chat-model.timeout=PT60S

# Session data path
session.data.path=../../conference-data/sessions.json

# A2A Agent Configuration
a2a.agent.name=Session Recommender Agent
a2a.agent.description=Recommends DevConf 2026 sessions based on attendee interests, tracks, and schedule.
a2a.agent.version=1.0.0
a2a.agent.url=http://localhost:8081
