# Quarkus HTTP
quarkus.http.port=8090

# Ollama LLM Configuration
quarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.ollama.chat-model.model-id=granite4:350m
quarkus.langchain4j.ollama.chat-model.temperature=0.7
quarkus.langchain4j.ollama.timeout=60s

# Agent mesh — URLs of specialist agents to discover
concierge.agent-urls=http://localhost:8080,http://localhost:9000

# A2A Agent Configuration
a2a.agent.name=DevConf Concierge
a2a.agent.description=Orchestrates specialist agents to answer complex, multi-domain questions about DevConf 2026.
a2a.agent.version=1.0.0
a2a.agent.url=http://localhost:8090
