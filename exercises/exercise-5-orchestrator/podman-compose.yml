version: "3.8"

# Infrastructure for the DevSphere system.
# Provides PostgreSQL (for Expense Agent JPA stores) and Grafana LGTM (for OTel traces).
#
# Usage:
#   cd exercises/exercise-5-orchestrator
#   podman-compose up -d

services:
  postgresql:
    image: docker.io/library/postgres:17
    container_name: devconf-postgresql
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=devconf
      - POSTGRES_PASSWORD=devconf
      - POSTGRES_DB=devconf
    volumes:
      - pgdata:/var/lib/postgresql/data

  kafka:
    image: docker.io/apache/kafka:4.1.0
    container_name: devconf-kafka
    ports:
      - "9092:9092"

  lgtm:
    image: docker.io/grafana/otel-lgtm:latest
    container_name: devconf-lgtm
    ports:
      - "3000:3000"     # Grafana UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  pgdata:
