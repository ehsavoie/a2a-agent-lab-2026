# Quarkus HTTP
quarkus.http.port=8090
a2a.agent.url=http://localhost:8080

# OpenAI LLM Configuration
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.mode=responses
quarkus.langchain4j.openai.chat-model.model-name=gpt-6-luna
quarkus.langchain4j.openai.chat-model.reasoning-effort=medium
quarkus.langchain4j.openai.timeout=120s

# Logging
quarkus.log.category."io.quarkiverse.langchain4j".min-level=TRACE
quarkus.log.category."io.quarkiverse.langchain4j".level=TRACE
quarkus.log.category."dev.langchain4j".min-level=TRACE
quarkus.log.category."dev.langchain4j".level=TRACE
quarkus.log.category."dev.devconf.orchestrator".min-level=TRACE
quarkus.log.category."dev.devconf.orchestrator".level=TRACE

# Chat model request/response logging
quarkus.langchain4j.openai.chat-model.log-requests=true
quarkus.langchain4j.openai.chat-model.log-responses=true
quarkus.log.category."dev.ai4j.openai4j".min-level=TRACE
quarkus.log.category."dev.ai4j.openai4j".level=TRACE
quarkus.log.category."org.a2aproject.sdk".min-level=TRACE
quarkus.log.category."org.a2aproject.sdk".level=TRACE

# HTTP wire-level payload tracing (outbound to OpenAI and concierge)
quarkus.log.category."io.vertx.core.http".min-level=TRACE
quarkus.log.category."io.vertx.core.http".level=TRACE
quarkus.log.category."org.jboss.resteasy.reactive".min-level=DEBUG
quarkus.log.category."org.jboss.resteasy.reactive".level=DEBUG
quarkus.log.category."io.quarkus.rest.client".min-level=DEBUG
quarkus.log.category."io.quarkus.rest.client".level=DEBUG
