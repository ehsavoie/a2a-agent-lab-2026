<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevConf Concierge</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #1a1a2e;
            color: white;
            padding: 1rem 2rem;
            text-align: center;
        }
        header h1 { font-size: 1.4rem; font-weight: 600; }
        header p { font-size: 0.85rem; opacity: 0.7; margin-top: 0.3rem; }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            max-width: 75%;
            padding: 0.8rem 1.1rem;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .user {
            align-self: flex-end;
            background: #1a1a2e;
            color: white;
        }
        .assistant {
            align-self: flex-start;
            background: white;
            border: 1px solid #ddd;
        }
        .thinking {
            align-self: flex-start;
            background: white;
            border: 1px solid #ddd;
            opacity: 0.6;
            font-style: italic;
        }
        #input-area {
            padding: 1rem 2rem;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 0.8rem;
        }
        #query {
            flex: 1;
            padding: 0.7rem 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        #query:focus { border-color: #1a1a2e; }
        button {
            padding: 0.7rem 1.5rem;
            background: #1a1a2e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #16213e; }
    </style>
</head>
<body>
    <header>
        <h1>DevConf Concierge</h1>
        <p>Devoxx Belgium 2026 — Conference Assistant</p>
    </header>
    <div id="chat"></div>
    <div id="input-area">
        <input type="text" id="query" placeholder="Ask about sessions, travel..." autofocus>
        <button id="send" onclick="send()">Send</button>
    </div>
    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('query');
        const btn = document.getElementById('send');

        input.addEventListener('keydown', e => { if (e.key === 'Enter' && !btn.disabled) send(); });

        function addMessage(text, cls) {
            const div = document.createElement('div');
            div.className = 'message ' + cls;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        async function send() {
            const query = input.value.trim();
            if (!query) return;
            input.value = '';
            addMessage(query, 'user');
            btn.disabled = true;
            const thinking = addMessage('Thinking...', 'thinking');
            try {
                const res = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                thinking.remove();
                if (!res.ok) throw new Error('Server error: ' + res.status);
                const data = await res.json();
                addMessage(data.response, 'assistant');
            } catch (e) {
                thinking.remove();
                addMessage('Error: ' + e.message, 'assistant');
            }
            btn.disabled = false;
            input.focus();
        }
    </script>
</body>
</html>
