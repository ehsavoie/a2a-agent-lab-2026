# Quarkus HTTP
quarkus.http.port=8090

# Google AI Gemini LLM Configuration
quarkus.langchain4j.ai.gemini.api-key=${GOOGLE_AI_GEMINI_API_KEY}
quarkus.langchain4j.ai.gemini.chat-model.model-id=gemini-2.5-flash
quarkus.langchain4j.ai.gemini.chat-model.temperature=0.7
quarkus.langchain4j.ai.gemini.timeout=120s

# Logging
quarkus.log.category."io.quarkiverse.langchain4j".min-level=TRACE
quarkus.log.category."io.quarkiverse.langchain4j".level=DEBUG
quarkus.log.category."dev.langchain4j.agentic".min-level=TRACE
quarkus.log.category."dev.langchain4j.agentic".level=DEBUG
quarkus.log.category."dev.langchain4j".level=DEBUG
