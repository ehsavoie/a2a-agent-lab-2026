# Quarkus HTTP
quarkus.http.port=8090

# Ollama LLM Configuration
quarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.ollama.chat-model.model-id=granite4:350m
quarkus.langchain4j.ollama.chat-model.temperature=0.7
quarkus.langchain4j.ollama.timeout=120s

# Downstream agent URLs for discovery
orchestrator.agent-urls=http://localhost:8080,http://localhost:8081,http://localhost:9000,http://localhost:8082

# A2A Agent Identity
a2a.agent.name=DevSphere Orchestrator
a2a.agent.description=The primary edge router that decomposes complex queries and coordinates specialist agents
a2a.agent.version=1.0.0
a2a.agent.url=http://localhost:8090
