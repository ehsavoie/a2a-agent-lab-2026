# Quarkus HTTP
quarkus.http.port=8090

# Ollama LLM Configuration
quarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.ollama.chat-model.model-id=qwen2.5:7b
quarkus.langchain4j.ollama.chat-model.temperature=0.7
quarkus.langchain4j.ollama.timeout=1200s


# Logging
quarkus.log.category.io.quarkiverse.langchain4j.min-level=TRACE
quarkus.log.category.io.quarkiverse.langchain4j.level=DEBUG
quarkus.log.category.dev.langchain4j.agentic.min-level=TRACE
quarkus.log.category.dev.langchain4j.agentic.level=DEBUG
quarkus.log.category.dev.langchain4j.level=DEBUG
quarkus.log.category.io.quarkiverse.langchain4j.ollama.min-level=TRACE
quarkus.log.category.io.quarkiverse.langchain4j.ollama.level=TRACE
