# Quarkus HTTP
quarkus.http.port=8080

# Ollama LLM Configuration
quarkus.langchain4j.ollama.base-url=http://localhost:11434
#quarkus.langchain4j.ollama.chat-model.model-id=hf.co/Menlo/Jan-nano-gguf:Q4_K_M
quarkus.langchain4j.ollama.chat-model.model-id=granite4:350m

quarkus.langchain4j.ollama.chat-model.temperature=0.7
quarkus.langchain4j.ollama.timeout=120s
quarkus.langchain4j.ollama.chat-model.log-requests=true
quarkus.langchain4j.ollama.chat-model.log-responses=true
# Session data path
session.data.path=../../conference-data/sessions.json

# A2A Agent Identity
a2a.agent.name=Schedule & Content Advisor
a2a.agent.description=Deep-scans the DevConf session catalog and matches attendee interests to talks
a2a.agent.version=1.0.0
a2a.agent.url=http://localhost:8080