# Quarkus HTTP
quarkus.http.port=8080

# Google AI Gemini LLM Configuration
quarkus.langchain4j.ai.gemini.api-key=${GOOGLE_AI_GEMINI_API_KEY}
quarkus.langchain4j.ai.gemini.chat-model.model-id=gemini-2.5-flash
quarkus.langchain4j.ai.gemini.chat-model.temperature=0.7
quarkus.langchain4j.ai.gemini.timeout=120s
quarkus.langchain4j.ai.gemini.chat-model.log-requests=true
quarkus.langchain4j.ai.gemini.chat-model.log-responses=true
# Session data path
session.data.path=../../conference-data/sessions.json

# A2A Agent Identity
a2a.agent.name=Schedule & Content Advisor
a2a.agent.description=Deep-scans the DevConf session catalog and matches attendee interests to talks
a2a.agent.version=1.0.0
a2a.agent.url=http://localhost:8080

# Authorization is not configured in this application
a2a.authorization.required=false