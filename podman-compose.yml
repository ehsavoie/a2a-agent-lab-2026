version: "3.8"

services:
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: devconf-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-pull:
    image: docker.io/ollama/ollama:latest
    container_name: devconf-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "granite4.1:3b"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  lgtm:
    image: docker.io/grafana/otel-lgtm:latest
    container_name: devconf-lgtm
    ports:
      - "3000:3000"     # Grafana UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  ollama-data:
